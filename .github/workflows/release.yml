name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Build whisper.cpp
        run: ./scripts/build-whisper.sh

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      # НЕ `make app`: тот путь идёт через голый swiftc, где нет SPM, и
      # FluidAudioEngine компилируется в пустоту под `#if canImport(FluidAudio)`.
      # Собранный так DMG приезжал бы без Parakeet v3 — а именно его онбординг
      # скачивает и выставляет движком новому пользователю.
      - name: Build app (universal, все движки)
        run: ./scripts/build-release.sh

      - name: Create DMG
        run: |
          chmod +x ./scripts/create-dmg.sh
          ./scripts/create-dmg.sh

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          cd build
          shasum -a 256 Flowka.dmg > Flowka.dmg.sha256
          SHA=$(shasum -a 256 Flowka.dmg | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          cat Flowka.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          SHA256: ${{ steps.checksum.outputs.sha }}
        with:
          files: |
            build/Flowka.dmg
            build/Flowka.dmg.sha256
          generate_release_notes: true
          append_body: true
          body: |

            ### Verify download integrity
            ```
            shasum -a 256 Flowka.dmg
            ```
            Expected SHA256: see `Flowka.dmg.sha256` attached to this release.

            Сборка подписана ad-hoc, без нотаризации: при первом запуске
            Gatekeeper покажет предупреждение — правый клик по приложению → Open.
